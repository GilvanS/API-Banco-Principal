                  cardNumber:
                    type: string
                    example: "5658719913873559"
                    description: "Número do cartão (parcialmente mascarado)"
                  valorTotal:
                    type: number
                    format: float
                    example: 150.75
                    description: "Valor total da fatura"
                  valorMinimo:
                    type: number
                    format: float
                    example: 15.08
                    description: "Valor mínimo da fatura"
                  limite:
                    type: number
                    format: float
                    example: 1000.00
                    description: "Limite total do cartão"
                  limiteDisponivel:
                    type: number
                    format: float
                    example: 849.25
                    description: "Limite disponível para uso"
                  dataVencimento:
                    type: string
