openapi: 3.0.0
info:
  title: API Banco Principal
  description: |
    API REST completa para sistema bancário digital moderno.
    
    Esta API oferece funcionalidades essenciais para operações bancárias, incluindo:
    - Gerenciamento de contas de usuário
    - Cartões de crédito e débito
    - Transações financeiras (depósitos, transferências, compras)
    - Investimentos e rentabilidade
    - Extratos e relatórios
    
    ## Autenticação
    A API utiliza JWT (JSON Web Tokens) para autenticação. Após o login, inclua o token no header:
    ```
    Authorization: Bearer <seu-token-jwt>
    ```
    
    ## Códigos de Status
    - `200` - Sucesso
    - `201` - Criado com sucesso
    - `400` - Erro de validação
    - `401` - Não autorizado
    - `404` - Recurso não encontrado
    - `500` - Erro interno do servidor
  version: 2.0.0
  contact:
    name: Suporte API Banco Principal
    email: suporte@bancoprincipal.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: Servidor de desenvolvimento
  - url: https://api.bancoprincipal.com
    description: Servidor de produção

paths:
  /health:
    get:
      tags:
        - Sistema
      summary: Verificação de saúde da API
      description: Endpoint para verificar se a API está funcionando corretamente
      responses:
        '200':
          description: API funcionando normalmente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"
                  timestamp:
                    type: string
                    format: date-time
                  uptime:
                    type: number

  /api/v1/auth/register:
    post:
      tags:
        - Autenticação
      summary: Registrar novo usuário
      description: Cria uma nova conta de usuário no sistema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
      responses:
        '201':
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreatedResponse'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      tags:
        - Autenticação
      summary: Login do usuário
      description: Autentica o usuário e retorna um token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/account/profile:
    get:
      tags:
        - Conta
      summary: Dados do perfil do usuário
      description: Retorna informações da conta do usuário logado
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Dados do perfil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/account/statement:
    get:
      tags:
        - Conta
      summary: Extrato da conta
      description: Retorna o extrato detalhado da conta com filtros opcionais
      security:
        - BearerAuth: []
      parameters:
        - name: startDate
          in: query
          description: Data inicial (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: Data final (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: transactionType
          in: query
          description: Tipo de transação
          schema:
            type: string
            enum: [ALL, DEPOSIT, TRANSFER, CREDIT_PURCHASE, BILL_PAYMENT]
      responses:
        '200':
          description: Extrato da conta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountStatement'

  /api/v1/cards:
    get:
      tags:
        - Cartões
      summary: Lista cartões do usuário
      description: Retorna todos os cartões associados ao usuário
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lista de cartões
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardsResponse'

  # Endpoint removido: /api/v1/cards/request
  # Motivo: Com cartão múltiplo (débito + crédito), não é mais necessário solicitar cartão de crédito separadamente
  # Os cartões são criados automaticamente na abertura da conta

  /api/v1/cartoes/segunda-via:
    post:
      tags:
        - Cartões
      summary: Solicitar segunda via de cartão
      description: Solicita uma segunda via de cartão por motivo de perda, roubo ou danificação
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecondCardRequest'
      responses:
        '201':
          description: Segunda via solicitada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecondCardResponse'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/cards/{cardId}/block:
    put:
      tags:
        - Cartões
      summary: Bloquear cartão
      description: Bloqueia um cartão específico do usuário por motivos de segurança
      security:
        - BearerAuth: []
      parameters:
        - name: cardId
          in: path
          required: true
          description: ID do cartão a ser bloqueado
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Motivo do bloqueio
                  example: "Suspeita de fraude"
      responses:
        '200':
          description: Cartão bloqueado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardBlockResponse'
        '400':
          description: Cartão já está bloqueado ou dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Cartão não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/cards/{cardId}/unblock:
    put:
      tags:
        - Cartões
      summary: Desbloquear cartão
      description: Desbloqueia um cartão previamente bloqueado
      security:
        - BearerAuth: []
      parameters:
        - name: cardId
          in: path
          required: true
          description: ID do cartão a ser desbloqueado
          schema:
            type: string
      responses:
        '200':
          description: Cartão desbloqueado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardUnblockResponse'
        '400':
          description: Cartão já está ativo ou dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Cartão não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/transactions/deposit:
    post:
      tags:
        - Transações
      summary: Depósito em conta
      description: Realiza um depósito na conta do usuário
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositRequest'
      responses:
        '201':
          description: Depósito realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'

  /api/v1/transactions/transfer:
    post:
      tags:
        - Transações
      summary: Transferência entre contas
      description: Realiza transferência para outra conta
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '201':
          description: Transferência realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'

  /api/v1/transactions/credit-purchase:
    post:
      tags:
        - Transações
      summary: Compra no cartão de crédito
      description: Realiza uma compra utilizando o cartão de crédito
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditPurchaseRequest'
      responses:
        '201':
          description: Compra realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'

  /api/v1/transactions/pay-bill:
    post:
      tags:
        - Transações
      summary: Pagamento de faturas
      description: Realiza o pagamento de faturas (cartão de crédito, financiamentos, etc.)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillPaymentRequest'
      responses:
        '201':
          description: Pagamento realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'

  /api/v1/investments/summary:
    get:
      tags:
        - Investimentos
      summary: Resumo de investimentos
      description: Retorna o resumo dos investimentos e rentabilidade do usuário
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Resumo de investimentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentSummary'

  /api/v1/investments/applications:
    get:
      tags:
        - Investimentos
      summary: Listar aplicações
      description: Lista todas as aplicações de investimento do usuário com paginação
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Lista de aplicações
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentApplicationsResponse'

  /api/v1/investments/simulate:
    post:
      tags:
        - Investimentos
      summary: Simular investimento
      description: Simula um investimento com diferentes tipos e valores
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestmentSimulationRequest'
      responses:
        '200':
          description: Simulação de investimento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentSimulationResponse'

  /api/v1/investments/apply:
    post:
      tags:
        - Investimentos
      summary: Aplicar em investimento
      description: Realiza uma aplicação em investimento
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestmentApplicationRequest'
      responses:
        '201':
          description: Aplicação realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentApplicationResponse'

  /api/v1/investments/savings-program/configure:
    put:
      tags:
        - Investimentos
      summary: Configurar programa de poupança
      description: Configura programa automático de poupança
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavingsProgramRequest'
      responses:
        '200':
          description: Programa configurado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsProgramResponse'

  /api/v1/investments/savings:
    get:
      tags:
        - Investimentos
      summary: Consultar poupança
      description: Retorna informações sobre investimentos em poupança
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Informações da poupança
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsResponse'

  /api/v1/investments/{investmentId}/yield:
    get:
      tags:
        - Investimentos
      summary: Consultar rendimento
      description: Consulta o rendimento de um investimento específico
      security:
        - BearerAuth: []
      parameters:
        - name: investmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rendimento do investimento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentYieldResponse'

  /api/v1/investments/{investmentId}/redeem:
    post:
      tags:
        - Investimentos
      summary: Resgatar investimento
      description: Realiza o resgate total ou parcial de um investimento
      security:
        - BearerAuth: []
      parameters:
        - name: investmentId
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestmentRedeemRequest'
      responses:
        '200':
          description: Resgate realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentRedeemResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserRegistration:
      type: object
      required:
        - nomeCompleto
        - cpf
        - email
        - senha
        - telefone
      properties:
        nomeCompleto:
          type: string
          example: "João Silva Santos"
        cpf:
          type: string
          pattern: '^[0-9]{11}$'
          example: "12345678901"
        email:
          type: string
          format: email
          example: "joao.silva@email.com"
        senha:
          type: string
          minLength: 8
          example: "MinhaSenh@123"
        telefone:
          type: string
          example: "11987654321"
        endereco:
          type: object
          properties:
            rua:
              type: string
              example: "Rua das Flores, 123"
            cidade:
              type: string
              example: "São Paulo"
            estado:
              type: string
              example: "SP"
            cep:
              type: string
              example: "01234-567"

    LoginRequest:
      type: object
      required:
        - cpf
        - senha
      properties:
        cpf:
          type: string
          example: "12345678901"
        senha:
          type: string
          example: "MinhaSenh@123"

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        usuario:
          $ref: '#/components/schemas/UserProfile'

    UserCreatedResponse:
      type: object
      properties:
        message:
          type: string
          example: "Usuário criado com sucesso"
        usuario:
          type: object
          properties:
            id:
              type: string
              example: "uuid-123"
            nomeCompleto:
              type: string
              example: "João Silva Santos"
            agencia:
              type: string
              example: "0001"
            numeroConta:
              type: string
              example: "123456"

    UserProfile:
      type: object
      properties:
        id:
          type: string
        nomeCompleto:
          type: string
        cpf:
          type: string
        email:
          type: string
        agencia:
          type: string
        numeroConta:
          type: string
        saldo:
          type: number
          format: float
        limiteDebitoDiario:
          type: number
          format: float
        limiteCreditoDiario:
          type: number
          format: float

    AccountStatement:
      type: object
      properties:
        account:
          $ref: '#/components/schemas/UserProfile'
        statement:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        summary:
          type: object
          properties:
            totalEntradas:
              type: number
              format: float
            totalSaidas:
              type: number
              format: float
            saldoInicial:
              type: number
              format: float
            saldoFinal:
              type: number
              format: float

    Transaction:
      type: object
      properties:
        id:
          type: string
        tipo:
          type: string
          enum: [DEPOSIT, TRANSFER, CREDIT_PURCHASE, BILL_PAYMENT]
        valor:
          type: number
          format: float
        descricao:
          type: string
        dataTransacao:
          type: string
          format: date-time
        status:
          type: string
          enum: [PENDING, COMPLETED, FAILED]

    CardsResponse:
      type: object
      properties:
        cards:
          type: array
          items:
            $ref: '#/components/schemas/Card'

    Card:
      type: object
      properties:
        id:
          type: string
        numeroCartao:
          type: string
          example: "****-****-****-1234"
        tipoCartao:
          type: string
          enum: [DEBITO, CREDITO]
        limiteCredito:
          type: number
          format: float
        creditoUtilizado:
          type: number
          format: float
        status:
          type: string
          enum: [ATIVO, BLOQUEADO, CANCELADO]

    CardRequest:
      type: object
      required:
        - tipoCartao
        - limiteCredito
      properties:
        tipoCartao:
          type: string
          enum: [CREDITO]
        limiteCredito:
          type: number
          format: float
          example: 5000.00

    CardCreatedResponse:
      type: object
      properties:
        message:
          type: string
          example: "Cartão solicitado com sucesso"
        cartao:
          $ref: '#/components/schemas/Card'

    SecondCardRequest:
      type: object
      required:
        - motivo
      properties:
        motivo:
          type: string
          enum: [perda, roubo, danificacao]
          example: "perda"
          description: "Motivo da solicitação da segunda via"
        bandeira:
          type: string
          enum: [master, visa, elo, amex]
          example: "visa"
          description: "Bandeira do cartão (opcional)"

    SecondCardResponse:
      type: object
      properties:
        message:
          type: string
          example: "Segunda via de cartão criada com sucesso"
        cartaoAnterior:
          type: object
          properties:
            id:
              type: string
            numeroCartao:
              type: string
              example: "****-****-****-1234"
            status:
              type: string
              example: "CANCELADO"
        novoCartao:
          type: object
          properties:
            id:
              type: string
            numeroCartao:
              type: string
              example: "****-****-****-5678"
            cvv:
              type: string
              example: "123"
            dataVencimento:
              type: string
              format: date
              example: "2029-12-31"
            status:
              type: string
              example: "ATIVO"
            tipoCartao:
              type: string
              example: "DEBITO"
            bandeira:
              type: string
              example: "VISA"
        usuario:
          type: object
          properties:
            id:
              type: string
            nomeCompleto:
              type: string
            agencia:
              type: string
            numeroConta:
              type: string

    CardBlockResponse:
      type: object
      properties:
        cardId:
          type: string
          example: "card-uuid-123"
        status:
          type: string
          example: "BLOCKED"
        reason:
          type: string
          example: "Bloqueio solicitado pelo usuário"
        blockedAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        message:
          type: string
          example: "Cartão bloqueado com sucesso"

    CardUnblockResponse:
      type: object
      properties:
        cardId:
          type: string
          example: "card-uuid-123"
        status:
          type: string
          example: "ACTIVE"
        unblockedAt:
          type: string
          format: date-time
          example: "2024-01-15T11:00:00Z"
        message:
          type: string
          example: "Cartão desbloqueado com sucesso"

    DepositRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
          format: float
          minimum: 0.01
          example: 500.00
        description:
          type: string
          example: "Depósito via transferência"

    TransferRequest:
      type: object
      required:
        - amount
        - destinationAccount
        - destinationAgency
        - destinationName
      properties:
        amount:
          type: number
          format: float
          minimum: 0.01
          example: 200.00
        destinationAccount:
          type: string
          example: "654321"
        destinationAgency:
          type: string
          example: "0002"
        destinationName:
          type: string
          example: "Maria Santos"
        description:
          type: string
          example: "Transferência PIX"

    CreditPurchaseRequest:
      type: object
      required:
        - amount
        - merchant
      properties:
        amount:
          type: number
          format: float
          minimum: 0.01
          example: 150.00
        merchant:
          type: string
          example: "Supermercado ABC"
        description:
          type: string
          example: "Compra de produtos"

    BillPaymentRequest:
      type: object
      required:
        - amount
        - billType
      properties:
        amount:
          type: number
          format: float
          minimum: 0.01
          example: 300.00
        billType:
          type: string
          enum: [CREDIT_CARD, FINANCING, UTILITIES, INSURANCE]
          example: "CREDIT_CARD"
        description:
          type: string
          example: "Pagamento de fatura do cartão"

    TransactionResponse:
      type: object
      properties:
        transactionId:
          type: string
          example: "txn-uuid-123"
        type:
          type: string
          enum: [DEPOSIT, TRANSFER, CREDIT_PURCHASE, BILL_PAYMENT]
        amount:
          type: number
          format: float
        status:
          type: string
          enum: [PENDING, COMPLETED, FAILED]
        timestamp:
          type: string
          format: date-time
        description:
          type: string

    InvestmentSummary:
      type: object
      properties:
        totalInvestido:
          type: number
          format: float
          example: 10000.00
        totalAtual:
          type: number
          format: float
          example: 10500.00
        rentabilidadeTotal:
          type: number
          format: float
          example: 5.0
        investments:
          type: array
          items:
            $ref: '#/components/schemas/Investment'

    Investment:
      type: object
      properties:
        id:
          type: string
        tipoInvestimento:
          type: string
          enum: [CDB, POUPANCA, TESOURO_DIRETO, FUNDOS]
        valorInvestido:
          type: number
          format: float
        valorAtual:
          type: number
          format: float
        rentabilidade:
          type: number
          format: float
        dataCriacao:
          type: string
          format: date-time

    InvestmentApplicationsResponse:
      type: object
      properties:
        investments:
          type: array
          items:
            $ref: '#/components/schemas/Investment'
        pagination:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer

    InvestmentSimulationRequest:
      type: object
      required:
        - amount
        - type
        - period
      properties:
        amount:
          type: number
          format: float
          minimum: 100
          example: 1000.00
        type:
          type: string
          enum: [CDB, POUPANCA, TESOURO_DIRETO, FUNDOS]
          example: "CDB"
        period:
          type: integer
          minimum: 1
          example: 12

    InvestmentSimulationResponse:
      type: object
      properties:
        simulation:
          type: object
          properties:
            initialAmount:
              type: number
              format: float
            finalAmount:
              type: number
              format: float
            totalReturn:
              type: number
              format: float
            returnPercentage:
              type: number
              format: float
            monthlyReturn:
              type: number
              format: float
            investmentType:
              type: string
            period:
              type: integer
            riskLevel:
              type: string
              enum: [BAIXO, MEDIO, ALTO]

    InvestmentApplicationRequest:
      type: object
      required:
        - amount
        - type
      properties:
        amount:
          type: number
          format: float
          minimum: 100
          example: 1000.00
        type:
          type: string
          enum: [CDB, POUPANCA, TESOURO_DIRETO, FUNDOS]
          example: "CDB"
        name:
          type: string
          example: "CDB Banco Principal"
        description:
          type: string
          example: "Investimento em CDB com rentabilidade de 110% do CDI"

    InvestmentApplicationResponse:
      type: object
      properties:
        message:
          type: string
          example: "Investimento aplicado com sucesso"
        investment:
          type: object
          properties:
            investmentId:
              type: string
            type:
              type: string
            amount:
              type: number
              format: float
            status:
              type: string
            applicationDate:
              type: string
              format: date-time

    SavingsProgramRequest:
      type: object
      required:
        - monthlyAmount
        - dayOfMonth
      properties:
        monthlyAmount:
          type: number
          format: float
          minimum: 50
          example: 200.00
        dayOfMonth:
          type: integer
          minimum: 1
          maximum: 28
          example: 15
        autoIncrease:
          type: boolean
          example: true
        increasePercentage:
          type: number
          format: float
          example: 5.0

    SavingsProgramResponse:
      type: object
      properties:
        message:
          type: string
          example: "Programa de poupança configurado com sucesso"
        program:
          type: object
          properties:
            monthlyAmount:
              type: number
              format: float
            dayOfMonth:
              type: integer
            nextInvestment:
              type: string
              format: date-time
            status:
              type: string

    SavingsResponse:
      type: object
      properties:
        totalSavings:
          type: number
          format: float
        monthlyYield:
          type: number
          format: float
        totalYield:
          type: number
          format: float
        savingsAccounts:
          type: array
          items:
            $ref: '#/components/schemas/Investment'

    InvestmentYieldResponse:
      type: object
      properties:
        investment:
          type: object
          properties:
            investmentId:
              type: string
            name:
              type: string
            type:
              type: string
            status:
              type: string
            performance:
              type: object
              properties:
                initialAmount:
                  type: number
                  format: float
                currentValue:
                  type: number
                  format: float
                totalReturn:
                  type: number
                  format: float
                returnPercentage:
                  type: number
                  format: float
                investmentDate:
                  type: string
                  format: date-time
                daysInvested:
                  type: integer
                maturityDate:
                  type: string
                  format: date-time
            details:
              type: object
              properties:
                returnRate:
                  type: number
                  format: float
                currentYield:
                  type: number
                  format: float
                canRedeem:
                  type: boolean
                description:
                  type: string

    InvestmentRedeemRequest:
      type: object
      properties:
        amount:
          type: number
          format: float
          description: "Valor a ser resgatado. Se não informado, resgata o valor total"
          example: 500.00

    InvestmentRedeemResponse:
      type: object
      properties:
        message:
          type: string
          example: "Resgate realizado com sucesso"
        redemption:
          type: object
          properties:
            investmentId:
              type: string
            redeemedAmount:
              type: number
              format: float
            remainingAmount:
              type: number
              format: float
            newAccountBalance:
              type: number
              format: float
            redemptionDate:
              type: string
              format: date-time
        account:
          type: object
          properties:
            agencia:
              type: string
            conta:
              type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Mensagem de erro"
        message:
          type: string
          example: "Descrição detalhada do erro"
        statusCode:
          type: integer
          example: 400
        timestamp:
          type: string
          format: date-time

