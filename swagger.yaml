openapi: 3.0.0
info:
  title: API NuvemBank
  description: |
    API enxuta e focada na aquisição de novos clientes e geração de massa de dados para o projeto NuvemBank.
    
    ## Foco
    - Criação de cliente
    - Login
    - Movimentação de conta
    - Consulta de dados
    
    ## 🚀 Integração com Postman
    
    Esta API inclui uma **Collection Postman completa** com automação avançada:
    
    ### ✅ Autenticação Automática
    - **Token JWT salvo automaticamente** no environment após login
    - **Renovação automática** quando o token expira
    - **Scripts de pre-request** que garantem autenticação transparente
    - **Variáveis de environment** atualizadas automaticamente
    
    ### 📋 Variáveis Automáticas
    - `authToken`: Token JWT para todas as requisições
    - `userId`: ID do usuário logado
    - `tokenExpiry`: Controle de expiração do token
    - `clienteId`, `cartaoId`: IDs salvos automaticamente após criação
    
    ### 🔧 Como Usar
    1. Importe `API-Banco-Principal.postman_collection.json`
    2. Importe `API Banco Principal - Environment.postman_environment.json`
    3. Selecione o environment "API Banco Principal - Environment"
    4. Execute qualquer requisição - o login será feito automaticamente!
    
    **Não é necessário fazer login manual** - tudo é automatizado via scripts!
  version: 1.0.0
  contact:
    name: Equipe NuvemBank
    email: suporte@nuvembank.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:3000/api/v1
    description: Servidor de Desenvolvimento

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        **Autenticação JWT Automática**
        
        O sistema utiliza tokens JWT para autenticação. Com a Collection Postman fornecida:
        
        ✅ **Processo Automatizado:**
        1. Faça login via `/auth/login` - token é salvo automaticamente
        2. Todas as requisições subsequentes usam o token automaticamente
        3. Token é renovado automaticamente quando expira
        
        ✅ **Variáveis de Environment:**
        - `authToken`: Token JWT (salvo automaticamente)
        - `userId`: ID do usuário autenticado
        
        ✅ **Headers Automáticos:**
        ```
        Authorization: Bearer {{authToken}}
        ```
        
        **Não é necessário configurar headers manualmente** - tudo é automatizado!
  schemas:
    Cartao:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "2b9f98f6-3f51-4cea-b4aa-192dee2db4fe"
        tipo:
          type: string
          enum: [debito, credito]
          example: "credito"
        titularidade:
          type: string
          enum: [titular, adicional]
          example: "titular"
        bandeira:
          type: string
          enum: [master, mastercard, visa, elo, amex]
          example: "visa"
        numero:
          type: string
          example: "428460675172344"
        cvv:
          type: string
          example: "438"
        dataValidade:
          type: string
          example: "08/30"
        status:
          type: string
          enum: [ativo, bloqueado]
          example: "ativo"
        limite:
          type: number
          format: float
          nullable: true
          example: 1500
        pin:
          type: string
          nullable: true
          example: null
        dataCriacao:
          type: string
          format: date-time
          example: "2025-08-02T17:41:15.000Z"
        usuarioConta:
          $ref: '#/components/schemas/UsuarioConta'
    UsuarioConta:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "0b4fe053-84c3-4524-92e9-2555bd24b353"
        nomeCompleto:
          type: string
          example: "João Silva Teste"
        cpf:
          type: string
          example: "12345678901"
        agencia:
          type: string
          example: "0001"
        numeroConta:
          type: string
          example: "37688147"
        limiteCredito:
          type: number
          format: float
          description: "Limite de crédito total da conta."
          example: 1000
        creditoUtilizado:
          type: number
          format: float
          description: "Crédito utilizado da conta."
          example: 0
        saldo:
          type: number
          format: float
          description: "Saldo atual da conta."
          example: 200
        ativo:
          type: boolean
          description: "Indica se a conta está ativa."
          example: true
        contaBloqueada:
          type: boolean
          example: false
        limiteDebitoDiario:
          type: number
          format: float
          description: "Limite de débito diário da conta."
          example: 5000
        dataCriacao:
          type: string
          format: date-time
          example: "2025-08-02T17:41:14.000Z"
        dataAtualizacao:
          type: string
          format: date-time
          example: "2025-08-02T17:41:14.000Z"
        telefone:
          type: string
          example: "11999999999"
        email:
          type: string
          example: "usuario@email.com"
        dataNascimento:
          type: string
          format: date
          example: "1990-01-01"
        endereco:
          type: string
          example: "Rua das Flores, 123"
        notificacoesPush:
          type: boolean
          example: true
        notificacoesEmail:
          type: boolean
          example: true
        notificacoesSms:
          type: boolean
          example: false
        cartoes:
          type: array
          items:
            $ref: '#/components/schemas/Cartao'
        investimentos:
          type: array
          items:
            $ref: '#/components/schemas/Investment'
    Investment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "267c29c5-a10c-48c4-9035-0c2fdf80dab6"
          description: "ID único do investimento"
        tipo:
          type: string
          enum: [POUPANCA, CDB, LCI, LCA, TESOURO_DIRETO, FUNDOS]
          example: "POUPANCA"
          description: "Tipo do investimento"
        nome:
          type: string
          example: "Poupança Teste"
          description: "Nome personalizado do investimento"
        descricao:
          type: string
          nullable: true
          example: "Investimento de teste"
          description: "Descrição opcional do investimento"
        valorInvestido:
          type: number
          format: float
          example: 500.00
          description: "Valor investido inicialmente"
        valorAtual:
          type: number
          format: float
          example: 525.13
          description: "Valor atual do investimento com rendimentos"
        taxaRetorno:
          type: number
          format: float
          example: 0.5
          description: "Taxa de retorno anual (%)"
        dataVencimento:
          type: string
          format: date
          example: "2026-09-10"
          description: "Data de vencimento do investimento"
        status:
          type: string
          enum: [ATIVO, VENCIDO, RESGATADO]
          example: "ATIVO"
          description: "Status atual do investimento"
        podeResgatar:
          type: boolean
          example: true
          description: "Indica se o investimento permite resgate antecipado"
        dataAplicacao:
          type: string
          format: date-time
          example: "2025-09-11T01:43:53.000Z"
          description: "Data e hora da aplicação"
        dataAtualizacao:
          type: string
          format: date-time
          example: "2025-09-11T01:43:53.000Z"
          description: "Data da última atualização"
        usuarioContaId:
          type: string
          format: uuid
          example: "0b4fe053-84c3-4524-92e9-2555bd24b353"
          description: "ID do usuário proprietário do investimento"
    InvestmentYield:
      type: object
      description: "Informações detalhadas de rendimento de um investimento"
      properties:
        investmentId:
          type: string
          format: uuid
          example: "267c29c5-a10c-48c4-9035-0c2fdf80dab6"
        name:
          type: string
          example: "Poupança Teste"
        type:
          type: string
          example: "POUPANCA"
        status:
          type: string
          example: "ATIVO"
        investedAmount:
          type: number
          format: float
          example: 500.00
          description: "Valor investido inicialmente"
        currentValue:
          type: number
          format: float
          example: 525.13
          description: "Valor atual do investimento"
        yield:
          $ref: '#/components/schemas/YieldDetails'
        period:
          $ref: '#/components/schemas/InvestmentPeriod'
        rates:
          $ref: '#/components/schemas/InvestmentRates'
        canRedeem:
          type: boolean
          example: true
        description:
          type: string
          nullable: true
          example: "Investimento de teste"
    YieldDetails:
      type: object
      description: "Detalhes de rendimento do investimento"
      properties:
        absolute:
          type: number
          format: float
          example: 25.13
          description: "Rendimento absoluto em reais"
        percentage:
          type: number
          format: float
          example: 5.03
          description: "Rendimento percentual"
        dailyAverage:
          type: number
          format: float
          example: 0.84
          description: "Rendimento diário médio em reais"
        monthlyProjected:
          type: number
          format: float
          example: 25.20
          description: "Rendimento mensal projetado em reais"
        annualProjected:
          type: number
          format: float
          example: 306.60
          description: "Rendimento anual projetado em reais"
    InvestmentPeriod:
      type: object
      description: "Informações de período do investimento"
      properties:
        investmentDate:
          type: string
          format: date-time
          example: "2025-09-11T01:43:53.000Z"
          description: "Data da aplicação"
        daysInvested:
          type: integer
          example: 30
          description: "Dias desde a aplicação"
        maturityDate:
          type: string
          format: date
          example: "2026-09-10"
          description: "Data de vencimento"
    InvestmentRates:
      type: object
      description: "Taxas e rendimentos do investimento"
      properties:
        returnRate:
          type: number
          format: float
          example: 0.5
          description: "Taxa de retorno anual (%)"
        currentYield:
          type: number
          format: float
          example: 5.03
          description: "Rendimento atual (%)"
    InvestmentSummary:
      type: object
      description: "Resumo completo dos investimentos do usuário"
      properties:
        totalInvested:
          type: number
          format: float
          example: 5000.00
          description: "Valor total investido"
        currentValue:
          type: number
          format: float
          example: 5250.75
          description: "Valor atual de todos os investimentos"
        totalReturn:
          type: number
          format: float
          example: 250.75
          description: "Rendimento total absoluto"
        returnPercentage:
          type: number
          format: float
          example: 5.02
          description: "Percentual de rentabilidade total"
        activeInvestments:
          type: integer
          example: 3
          description: "Quantidade de investimentos ativos"
        byType:
          type: array
          description: "Investimentos agrupados por tipo"
          items:
            $ref: '#/components/schemas/InvestmentByType'
        recentInvestments:
          type: array
          description: "Investimentos mais recentes"
          items:
            $ref: '#/components/schemas/RecentInvestment'
    InvestmentByType:
      type: object
      description: "Agrupamento de investimentos por tipo"
      properties:
        tipo:
          type: string
          example: "POUPANCA"
        quantidade:
          type: integer
          example: 1
        valorInvestido:
          type: number
          format: float
          example: 1000.00
        valorAtual:
          type: number
          format: float
          example: 1050.25
        rentabilidade:
          type: number
          format: float
          example: 5.03
    RecentInvestment:
      type: object
      description: "Investimento recente resumido"
      properties:
        id:
          type: string
          format: uuid
          example: "267c29c5-a10c-48c4-9035-0c2fdf80dab6"
        name:
          type: string
          example: "Poupança Teste"
        type:
          type: string
          example: "POUPANCA"
        investedAmount:
          type: number
          format: float
          example: 500.00
        currentValue:
          type: number
          format: float
          example: 525.13
        returnPercentage:
          type: number
          format: float
          example: 5.03
        status:
          type: string
          example: "ATIVO"
        createdAt:
          type: string
          format: date-time
          example: "2025-09-11T01:43:53.000Z"
    InvestmentApplication:
      type: object
      description: "Dados para aplicação em investimento"
      required: [tipo, valor, nome]
      properties:
        tipo:
          type: string
          enum: [POUPANCA, CDB, LCI, LCA, TESOURO_DIRETO, FUNDOS]
          example: "POUPANCA"
          description: "Tipo do investimento"
        valor:
          type: number
          format: float
          minimum: 1
          example: 500.00
          description: "Valor a ser investido (mínimo R$ 1,00)"
        nome:
          type: string
          example: "Poupança Teste"
          description: "Nome personalizado para o investimento"
        descricao:
          type: string
          example: "Investimento de teste"
          description: "Descrição opcional do investimento"
    InvestmentRedemption:
      type: object
      description: "Dados para resgate de investimento"
      required: [amount]
      properties:
        amount:
          type: number
          format: float
          minimum: 0.01
          example: 200.00
          description: "Valor a ser resgatado (deve ser maior que zero)"
    SaldoResponse:
      type: object
      properties:
        saldo:
          type: number
          format: float
          example: 200
        limiteCredito:
          type: number
          format: float
          example: 1000
        creditoUtilizado:
          type: number
          format: float
          example: 0
        creditoDisponivel:
          type: number
          format: float
          example: 1000
    Movimentacao:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "e8ffcb17-aa14-4830-8e31-3ca7199391fe"
        tipo:
          type: string
          enum: [deposito, saque, transferencia_enviada, transferencia_recebida, pix_enviado, pix_recebido, pagamento_cartao, investimento, rendimento, taxa, estorno]
          example: "transferencia_enviada"
        valor:
          type: number
          format: float
          example: 50
        descricao:
          type: string
          example: "Transferência enviada para Maria Silva (0001/12345678)"
        nomeDestinatario:
          type: string
          example: "Maria Silva"
        chavePix:
          type: string
          example: "11999999999"
        status:
          type: string
          enum: [pendente, concluida, cancelada, falhada]
          example: "conclida"
        taxa:
          type: number
          format: float
          example: 0
        observacoes:
          type: string
          example: "Observações adicionais"
        agenciaOrigem:
          type: string
          example: "0001"
        contaOrigem:
          type: string
          example: "87654321"
        agenciaDestino:
          type: string
          example: "0001"
        contaDestino:
          type: string
          example: "12345678"
        estabelecimento:
          type: string
          example: "Loja Exemplo"
        data:
          type: string
          format: date-time
          example: "2025-08-02T17:41:17.000Z"
        usuarioConta:
          $ref: '#/components/schemas/UsuarioConta'
    ExtratoResponse:
      type: object
      properties:
        movimentacoes:
          type: array
          items:
            $ref: '#/components/schemas/Movimentacao'
        paginacao:
          type: object
          properties:
            pagina:
              type: integer
              example: 1
            limite:
              type: integer
              example: 10
            total:
              type: integer
              example: 2
            totalPaginas:
              type: integer
              example: 1
    TransferenciaResponse:
      type: object
      properties:
        mensagem:
          type: string
          example: "Transferência realizada com sucesso"
        dados:
          type: object
          properties:
            agenciaOrigem:
              type: string
              example: "0001"
            contaOrigem:
              type: string
              example: "87654321"
            agenciaDestino:
              type: string
              example: "0001"
            contaDestino:
              type: string
              example: "12345678"
            valor:
              type: number
              format: float
              example: 100.00
            data:
              type: string
              format: date-time
              example: "2025-08-02T17:41:17.000Z"
    DepositoResponse:
      type: object
      properties:
        mensagem:
          type: string
          example: "Depósito realizado com sucesso"
        dados:
          type: object
          properties:
            agencia:
              type: string
              example: "0001"
            conta:
              type: string
              example: "12345678"
            valor:
              type: number
              format: float
              example: 500.00
            saldoAtual:
              type: number
              format: float
              example: 700.00
            data:
              type: string
              format: date-time
              example: "2025-08-02T17:41:17.000Z"
    ApiError:
      type: object
      properties:
        erro:
          type: string
          description: "Mensagem de erro"
          example: "Valor mínimo para transferência é R$ 10,00"
    SuccessResponse:
      type: object
      properties:
        mensagem:
          type: string
          description: "Mensagem de sucesso"
          example: "Compra realizada com sucesso"


tags:
  - name: "Autenticação"
    description: "Operações de login e autenticação."
  - name: "Clientes"
    description: "Operações de gestão de clientes."
  - name: "Cartões"
    description: "Operações de gestão de cartões."
  - name: "Transações"
    description: "Operações financeiras e transações."
  - name: "Contas"
    description: "Operações de gestão de contas bancárias."
  - name: "Configurações"
    description: "Configurações de usuário."
  - name: "Investimentos"
    description: "Operações de investimentos e poupança."

paths:
  /auth/login:
    post:
      tags: ["Autenticação"]
      summary: "Autentica um usuário e retorna um token JWT."
      description: |
        Endpoint de autenticação que valida as credenciais do usuário e retorna um token JWT para acesso aos recursos protegidos da API.
        
        ## 🔧 Integração com Postman
        
        **Salvamento Automático do Token:**
        - ✅ O token JWT é **automaticamente salvo** na variável `authToken` do environment
        - ✅ Dados do usuário são salvos nas variáveis `userId` e `tokenExpiry`
        - ✅ **Login automático** quando o token expira (via script de pre-request)
        - ✅ Todas as requisições subsequentes usam automaticamente o token salvo
        
        **Variáveis do Environment atualizadas automaticamente:**
        - `authToken`: Token JWT para autenticação
        - `userId`: ID do usuário logado
        - `tokenExpiry`: Data de expiração do token
        
        **Scripts Postman incluídos:**
        - **Pre-request Script**: Verifica validade do token e faz login automático se necessário
        - **Test Script**: Salva automaticamente o token e dados do usuário no environment
        
        Isso garante uma experiência de teste fluida, sem necessidade de copiar/colar tokens manualmente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cpf, senha]
              properties:
                cpf: 
                  type: string
                  example: "00000000000"
                senha: 
                  type: string
                  format: password
                  example: "AdminSenhaForte123"
      responses:
        '200':
          description: "Login bem-sucedido."
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  usuario:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      nomeCompleto:
                        type: string
                      cpf:
                        type: string
        '401':
          description: "CPF ou senha inválidos."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /clientes:
    post:
      tags: ["Clientes"]
      summary: "Cria um novo cliente."
      description: "Cria uma nova conta e gera um cartão de débito automaticamente."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nomeCompleto, cpf, senha, email]
              properties:
                nomeCompleto: 
                  type: string
                  example: "João Silva"
                cpf: 
                  type: string
                  example: "12345678901"
                senha: 
                  type: string
                  format: password
                  example: "SenhaForte123"
                email:
                  type: string
                  format: email
                  example: "joao.silva@email.com"
      responses:
        '201':
          description: "Cliente criado com sucesso."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioConta'
        '400':
          description: "Dados inválidos ou CPF já cadastrado."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /account/me:
    get:
      tags: ["Contas"]
      summary: "Consulta dados do usuário logado."
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Dados do usuário retornados com sucesso."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioConta'
        '401':
          description: "Token de autenticação inválido ou expirado."

  /account/balance:
    get:
      tags: ["Contas"]
      summary: "Consulta saldo do usuário logado."
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Saldo retornado com sucesso."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaldoResponse'
        '401':
          description: "Token de autenticação inválido ou expirado."

  /account/statement:
    get:
      tags: ["Contas"]
      summary: "Consulta extrato do usuário logado."
      security:
        - bearerAuth: []
      parameters:
        - name: pagina
          in: query
          schema:
            type: integer
            default: 1
        - name: limite
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: "Extrato retornado com sucesso."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtratoResponse'
        '401':
          description: "Token de autenticação inválido ou expirado."

  /cards:
    get:
      tags: ["Cartões"]
      summary: "Lista cartões do usuário logado."
      description: "Retorna todos os cartões (débito e crédito) do usuário autenticado."
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Cartões retornados com sucesso."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cartao'
        '401':
          description: "Token de autenticação inválido ou expirado."
    post:
      tags: ["Cartões"]
      summary: "Solicita um novo cartão para o usuário logado."
      description: "Cria uma solicitação de novo cartão (débito ou crédito) para o usuário autenticado. O cartão é automaticamente vinculado à conta do usuário."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo]
              properties:
                tipo:
                  type: string
                  enum: [debito, credito]
                  example: "credito"
                  description: "Tipo do cartão a ser solicitado"
      responses:
        '201':
          description: "Cartão solicitado com sucesso."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cartao'
        '400':
