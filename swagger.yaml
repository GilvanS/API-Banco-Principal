          description: "Token de autenticação inválido ou expirado."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /transactions/credit-purchase:
    post:
      tags: ["Transações"]
      summary: "Realiza compra com cartão de crédito do usuário logado."
      description: "Efetua uma compra utilizando o cartão de crédito ativo do usuário autenticado. O valor é debitado do limite disponível do cartão."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [valor, estabelecimento]
              properties:
                valor:
                  type: number
                  format: float
                  example: 50.00
                  description: "Valor da compra (deve ser maior que zero)"
                estabelecimento:
                  type: string
                  example: "Loja Exemplo"
                  description: "Nome do estabelecimento onde a compra foi realizada"
      responses:
        '201':
          description: "Compra realizada com sucesso."
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactionId:
                    type: string
                    example: "txn_123456789"
                  type:
                    type: string
                    example: "CREDIT_PURCHASE"
                  amount:
                    type: number
                    format: float
                    example: 50.00
                  description:
                    type: string
                    example: "Compra no crédito em Loja Exemplo"
                  date:
                    type: string
                    format: date-time
                    example: "2025-08-02T17:41:17.000Z"
                  status:
                    type: string
                    example: "COMPLETED"
                  cardId:
                    type: string
                    format: uuid
                    example: "2b9f98f6-3f51-4cea-b4aa-192dee2db4fe"
        '400':
          description: "Erro na compra (ex: valor inválido, limite insuficiente)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: "Token de autenticação inválido ou expirado."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: "Cartão de crédito ativo não encontrado para o usuário."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /account/bill-inquiry:
    get:
      tags: ["Contas"]
      summary: "Consulta fatura do cartão de crédito do usuário logado."
      description: "Retorna os detalhes da fatura atual do cartão de crédito ativo do usuário autenticado, incluindo valor total, valor mínimo, limite disponível e datas de vencimento."
