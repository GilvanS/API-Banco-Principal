openapi: 3.0.0
info:
  title: API Banco Principal
  description: |
    API REST completa para sistema bancário digital moderno.
    
    Esta API oferece funcionalidades essenciais para operações bancárias, incluindo:
    - Gerenciamento de contas de usuário
    - Cartões de crédito e débito
    - Transações financeiras (depósitos, transferências, compras)
    - Investimentos e rentabilidade
    - Extratos e relatórios
    
    ## Autenticação
    A API utiliza JWT (JSON Web Tokens) para autenticação. Após o login, inclua o token no header:
    ```
    Authorization: Bearer <seu-token-jwt>
    ```
    
    ## Códigos de Status
    - `200` - Sucesso
    - `201` - Criado com sucesso
    - `400` - Erro de validação
    - `401` - Não autorizado
    - `404` - Recurso não encontrado
    - `500` - Erro interno do servidor
  version: 2.0.0
  contact:
    name: Suporte API Banco Principal
    email: suporte@bancoprincipal.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: Servidor de desenvolvimento
  - url: https://api.bancoprincipal.com
    description: Servidor de produção

paths:
  /health:
    get:
      tags:
        - Sistema
      summary: Verificação de saúde da API
      description: Endpoint para verificar se a API está funcionando corretamente
      responses:
        '200':
          description: API funcionando normalmente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"
                  timestamp:
                    type: string
                    format: date-time
                  uptime:
                    type: number

  /api/v1/auth/register:
    post:
      tags:
        - Autenticação
      summary: Registrar novo usuário
      description: Cria uma nova conta de usuário no sistema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
      responses:
        '201':
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreatedResponse'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      tags:
        - Autenticação
      summary: Login do usuário
      description: Autentica o usuário e retorna um token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/account/profile:
    get:
      tags:
        - Conta
      summary: Dados do perfil do usuário
      description: Retorna informações da conta do usuário logado
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Dados do perfil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/account/statement:
    get:
      tags:
        - Conta
      summary: Extrato da conta
      description: Retorna o extrato detalhado da conta com filtros opcionais
      security:
        - BearerAuth: []
      parameters:
        - name: startDate
          in: query
          description: Data inicial (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: Data final (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: transactionType
          in: query
          description: Tipo de transação
          schema:
            type: string
            enum: [ALL, DEPOSIT, TRANSFER, CREDIT_PURCHASE, BILL_PAYMENT]
      responses:
        '200':
          description: Extrato da conta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountStatement'

  /api/v1/cards:
    get:
      tags:
        - Cartões
      summary: Lista cartões do usuário
      description: Retorna todos os cartões associados ao usuário
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lista de cartões
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardsResponse'

  # Endpoint removido: /api/v1/cards/request
  # Motivo: Com cartão múltiplo (débito + crédito), não é mais necessário solicitar cartão de crédito separadamente
  # Os cartões são criados automaticamente na abertura da conta

  /api/v1/cartoes/segunda-via:
    post:
      tags:
        - Cartões
      summary: Solicitar segunda via de cartão
      description: Solicita uma segunda via de cartão por motivo de perda, roubo ou danificação
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecondCardRequest'
      responses:
        '201':
          description: Segunda via solicitada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecondCardResponse'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/cards/{cardId}/block:
    put:
      tags:
        - Cartões
      summary: Bloquear cartão
      description: Bloqueia um cartão específico do usuário por motivos de segurança
      security:
        - BearerAuth: []
      parameters:
        - name: cardId
          in: path
          required: true
          description: ID do cartão a ser bloqueado
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Motivo do bloqueio
                  example: "Suspeita de fraude"
      responses:
        '200':
          description: Cartão bloqueado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardBlockResponse'
        '400':
          description: Cartão já está bloqueado ou dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Cartão não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/cards/{cardId}/unblock:
    put:
      tags:
        - Cartões
      summary: Desbloquear cartão
      description: Desbloqueia um cartão previamente bloqueado
      security:
        - BearerAuth: []
      parameters:
        - name: cardId
          in: path
          required: true
          description: ID do cartão a ser desbloqueado
          schema:
            type: string
      responses:
        '200':
          description: Cartão desbloqueado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardUnblockResponse'
        '400':
          description: Cartão já está ativo ou dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Cartão não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/transactions/deposit:
    post:
      tags:
        - Transações
      summary: Depósito em conta
      description: Realiza um depósito na conta do usuário
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositRequest'
      responses:
        '201':
          description: Depósito realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'

  /api/v1/transactions/transfer:
    post:
      tags:
        - Transações
      summary: Transferência entre contas
      description: Realiza transferência para outra conta
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '201':
          description: Transferência realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'

  /api/v1/transactions/transfer-by-cpf:
    post:
      tags:
        - Transações
      summary: Transferência por CPF
      description: Realiza transferência resolvendo automaticamente agência e conta a partir do CPF informado
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - destinationCpf
              properties:
                amount:
                  type: number
                  format: float
                  minimum: 0.01
                  example: 200.00
                destinationCpf:
                  type: string
                  pattern: '^[0-9]{11}$'
                  example: '12345678901'
                description:
                  type: string
                  example: 'Transferência por CPF'
      responses:
        '201':
          description: Transferência realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'

  /api/v1/transactions/pix:
    post:
      tags:
        - Transações
      summary: Transferência PIX
      description: Realiza uma transferência via PIX
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - pixKey
                - pixKeyType
              properties:
                amount:
                  type: number
                  format: float
                  minimum: 0.01
                  example: 150.00
                pixKey:
                  type: string
                  example: '12345678901'
                pixKeyType:
                  type: string
                  enum: [cpf, email]
                  example: 'cpf'
                description:
                  type: string
                  example: 'Pagamento de serviço via PIX'
      responses:
        '201':
          description: PIX realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'

  /api/v1/transactions/credit-bill/preview:
    get:
      tags:
        - Transações
      summary: Pré-visualizar fatura do cartão de crédito
      description: Retorna a pré-visualização da fatura do cartão de crédito ativo do usuário sem efetuar pagamento
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Pré-visualização da fatura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditBillPreviewResponse'

  /api/v1/transactions/credit-purchase:
    post:
      tags:
        - Transações
      summary: Compra no cartão de crédito
      description: Realiza uma compra utilizando o cartão de crédito
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditPurchaseRequest'
      responses:
        '201':
          description: Compra realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'

  /api/v1/transactions/withdraw:
    post:
      tags:
        - Transações
      summary: Saque em conta
      description: Realiza um saque da conta do usuário autenticado
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: number
                  format: float
                  minimum: 0.01
                  example: 100.00
                description:
                  type: string
                  example: 'Saque em conta'
      responses:
        '201':
          description: Saque realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'

  /api/v1/transactions/pay-bill:
    post:
      tags:
        - Transações
      summary: Pagamento de faturas
      description: Realiza o pagamento de faturas (cartão de crédito, financiamentos, etc.)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillPaymentRequest'
      responses:
        '201':
          description: Pagamento realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'

  /api/v1/investments/summary:
    get:
      tags:
        - Investimentos
      summary: Resumo de investimentos
      description: Retorna o resumo dos investimentos e rentabilidade do usuário
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Resumo de investimentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentSummary'

  /api/v1/investments/applications:
    get:
      tags:
        - Investimentos
      summary: Listar aplicações
      description: Lista todas as aplicações de investimento do usuário com paginação
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Lista de aplicações
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentApplicationsResponse'

  /api/v1/investments/simulate:
    post:
      tags:
        - Investimentos
      summary: Simular investimento
      description: Simula um investimento com diferentes tipos e valores
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestmentSimulationRequest'
      responses:
        '200':
          description: Simulação de investimento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentSimulationResponse'

  /api/v1/investments/apply:
    post:
      tags:
        - Investimentos
      summary: Aplicar em investimento
      description: Realiza uma aplicação em investimento
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestmentApplicationRequest'
      responses:
        '201':
          description: Aplicação realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentApplicationResponse'

  /api/v1/investments/savings-program/configure:
    put:
      tags:
        - Investimentos
      summary: Configurar programa de poupança
      description: Configura programa automático de poupança
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavingsProgramRequest'
      responses:
        '200':
          description: Programa configurado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsProgramResponse'

  /api/v1/investments/savings:
    get:
      tags:
        - Investimentos
      summary: Consultar poupança
      description: Retorna informações sobre investimentos em poupança
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Informações da poupança
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsResponse'

  /api/v1/investments/{investmentId}/yield:
    get:
      tags:
        - Investimentos
      summary: Consultar rendimento
      description: Consulta o rendimento de um investimento específico
      security:
        - BearerAuth: []
      parameters:
        - name: investmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rendimento do investimento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentYieldResponse'

  /api/v1/investments/{investmentId}/redeem:
    post:
      tags:
        - Investimentos
      summary: Resgatar investimento
      description: Realiza o resgate total ou parcial de um investimento
      security:
        - BearerAuth: []
      parameters:
        - name: investmentId
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestmentRedeemRequest'
      responses:
        '200':
          description: Resgate realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentRedeemResponse'

/api/v1/clientes:
  get:
    tags:
      - Clientes
    summary: Listar clientes
    description: Retorna a lista de clientes do sistema, sem incluir o campo de senha.
    responses:
      '200':
        description: Lista de clientes
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    example: "uuid-123"
                  nomeCompleto:
                    type: string
                    example: "Maria Oliveira"
                  cpf:
                    type: string
                    pattern: '^[0-9]{11}$'
                    example: "98765432100"
                  email:
                    type: string
                    format: email
                    example: "maria.oliveira@example.com"
                  agencia:
                    type: string
                    example: "0001"
                  numeroConta:
                    type: string
                    example: "123456"
                  saldo:
                    type: number
                    format: float
                    example: 2500.50
                  limiteCredito:
                    type: number
                    format: float
                    example: 3000.00
                  creditoUtilizado:
                    type: number
                    format: float
                    example: 450.75
                  ativo:
                    type: boolean
                    example: true
                  contaBloqueada:
                    type: boolean
                    example: false
                  limiteDebitoDiario:
                    type: number
                    format: float
                    example: 5000.00
                  tipoConta:
                    type: string
                    enum: [poupanca, corrente]
                    example: corrente
                  telefone:
                    type: string
                    nullable: true
                    example: "11987654321"
                  dataCriacao:
                    type: string
                    format: date-time
                  dataAtualizacao:
                    type: string
                    format: date-time
                  cartoes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        tipo:
                          type: string
                          enum: [debito, credito, multiplo]
                        bandeira:
                          type: string
                          enum: [master, mastercard, visa, elo, amex]
                        numero:
                          type: string
                          example: "5123 4567 8901 2345"
                        status:
                          type: string
                          enum: [ativo, bloqueado, cancelado, inativo]
                        limite:
                          type: number
                          format: float
                          nullable: true
                        faturaAtual:
                          type: number
                          format: float
                        limiteDisponivel:
                          type: number
                          format: float

  /api/v1/payments/boleto:
    post:
      tags:
        - Transações
      summary: Pagamento de boleto
      description: Realiza o pagamento de um boleto bancário pela linha digitável
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoletoPaymentRequest'
      responses:
        '201':
          description: Boleto pago com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'

  /api/v1/account/invoice:
    get:
      tags:
        - Conta
      summary: Consultar fatura atual do cartão de crédito
      description: Retorna informações resumidas da fatura atual do cartão de crédito do usuário
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Informações da fatura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditBillPreviewResponse'

  /api/v1/transactions/transfer-bank:
    post:
      tags:
        - Transações
      summary: Transferência por agência e conta
      description: Realiza transferência informando agência e conta do destinatário
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankTransferRequest'
      responses:
        '201':
          description: Transferência realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'

  /api/v1/pix/keys:
    get:
      tags:
        - Transações
      summary: Listar chaves PIX do usuário
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lista de chaves PIX
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PixKeysResponse'
    post:
      tags:
        - Transações
      summary: Cadastrar chave PIX
      description: Cadastra uma nova chave PIX para a conta do usuário
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PixKeyCreateRequest'
      responses:
        '201':
          description: Chave PIX cadastrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PixKey'

  /api/v1/transactions/transfer-pix:
    post:
      tags:
        - Transações
      summary: Transferência via chave PIX
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PixTransferRequest'
      responses:
        '201':
          description: PIX realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'

  /api/v1/cards/block:
    post:
      tags:
        - Cartões
      summary: Bloquear cartão do usuário
      description: Bloqueia o cartão ativo do usuário logado
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: 'Solicitado pelo usuário'
      responses:
        '200':
          description: Cartão bloqueado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardBlockResponse'

  /api/v1/cards/reissue:
    post:
      tags:
        - Cartões
      summary: Solicitar 2ª via do cartão
      description: Solicita a reemissão do cartão do usuário
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Solicitação registrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Solicitação de 2ª via registrada.'

  /api/v1/investments:
    get:
      tags:
        - Investimentos
      summary: Listar investimentos do usuário
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lista de investimentos do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentsList'

  /api/v1/investments/redeem:
    post:
      tags:
        - Investimentos
      summary: Resgatar investimento por corpo da requisição
      description: Resgata parcial ou totalmente um investimento informando o ID e valor desejado
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestmentRedeemRequest'
      responses:
        '200':
          description: Resgate realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentRedeemResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserRegistration:
      type: object
      required:
        - nomeCompleto
        - cpf
        - email
        - senha
        - telefone
      properties:
        nomeCompleto:
          type: string
          example: "João Silva Santos"
        cpf:
          type: string
          pattern: '^[0-9]{11}$'
          example: "12345678901"
        email:
          type: string
          format: email
          example: "joao.silva@email.com"
        senha:
          type: string
          minLength: 8
          example: "MinhaSenh@123"
        telefone:
          type: string
          example: "11987654321"
        endereco:
          type: object
          properties:
            rua:
              type: string
              example: "Rua das Flores, 123"
            cidade:
              type: string
              example: "São Paulo"
            estado:
              type: string
              example: "SP"
            cep:
              type: string
              example: "01234-567"

    LoginRequest:
      type: object
      required:
        - cpf
        - senha
      properties:
        cpf:
          type: string
          example: "12345678901"
        senha:
          type: string
          example: "MinhaSenh@123"

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        usuario:
          $ref: '#/components/schemas/UserProfile'

    UserCreatedResponse:
      type: object
      properties:
        message:
          type: string
          example: "Usuário criado com sucesso"
        usuario:
          type: object
          properties:
            id:
              type: string
              example: "uuid-123"
            nomeCompleto:
              type: string
              example: "João Silva Santos"
            agencia:
              type: string
              example: "0001"
            numeroConta:
              type: string
              example: "123456"

    UserProfile:
      type: object
      properties:
        id:
          type: string
        nomeCompleto:
          type: string
        cpf:
          type: string
        email:
          type: string
        agencia:
          type: string
        numeroConta:
          type: string
        saldo:
          type: number
          format: float
        limiteDebitoDiario:
          type: number
          format: float
        limiteCreditoDiario:
          type: number
          format: float

    AccountStatement:
      type: object
      properties:
        account:
          $ref: '#/components/schemas/UserProfile'
        statement:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        summary:
          type: object
          properties:
            totalEntradas:
              type: number
              format: float
            totalSaidas:
              type: number
              format: float
            saldoInicial:
              type: number
              format: float
            saldoFinal:
              type: number
              format: float

    Transaction:
      type: object
      properties:
        id:
          type: string
        tipo:
          type: string
          enum: [DEPOSIT, TRANSFER, CREDIT_PURCHASE, BILL_PAYMENT]
        valor:
          type: number
          format: float
        descricao:
          type: string
        dataTransacao:
          type: string
          format: date-time
        status:
          type: string
          enum: [PENDING, COMPLETED, FAILED]

    CardsResponse:
      type: object
      properties:
        cards:
          type: array
          items:
            $ref: '#/components/schemas/Card'

    Card:
      type: object
      properties:
        id:
          type: string
        numeroCartao:
          type: string
          example: "****-****-****-1234"
        tipoCartao:
          type: string
          enum: [DEBITO, CREDITO]
        limiteCredito:
          type: number
          format: float
        creditoUtilizado:
          type: number
          format: float
        status:
          type: string
          enum: [ATIVO, BLOQUEADO, CANCELADO]

    CardRequest:
      type: object
      required:
        - tipoCartao
        - limiteCredito
      properties:
        tipoCartao:
          type: string
          enum: [CREDITO]
        limiteCredito:
          type: number
          format: float
          example: 5000.00

    CardCreatedResponse:
      type: object
      properties:
        message:
          type: string
          example: "Cartão solicitado com sucesso"
        cartao:
          $ref: '#/components/schemas/Card'

    SecondCardRequest:
      type: object
      required:
        - motivo
      properties:
        motivo:
          type: string
          enum: [perda, roubo, danificacao]
          example: "perda"
          description: "Motivo da solicitação da segunda via"
        bandeira:
          type: string
          enum: [master, visa, elo, amex]
          example: "visa"
          description: "Bandeira do cartão (opcional)"

    SecondCardResponse:
      type: object
      properties:
        message:
          type: string
          example: "Segunda via de cartão criada com sucesso"
        cartaoAnterior:
          type: object
          properties:
            id:
              type: string
            numeroCartao:
              type: string
              example: "****-****-****-1234"
            status:
              type: string
              example: "CANCELADO"
        novoCartao:
          type: object
          properties:
            id:
              type: string
            numeroCartao:
              type: string
              example: "****-****-****-5678"
            cvv:
              type: string
              example: "123"
            dataVencimento:
              type: string
              format: date
              example: "2029-12-31"
            status:
              type: string
              example: "ATIVO"
            tipoCartao:
              type: string
              example: "DEBITO"
            bandeira:
              type: string
              example: "VISA"
        usuario:
          type: object
          properties:
            id:
              type: string
            nomeCompleto:
              type: string
            agencia:
              type: string
            numeroConta:
              type: string

    CardBlockResponse:
      type: object
      properties:
        cardId:
          type: string
          example: "card-uuid-123"
        status:
          type: string
          example: "BLOCKED"
        reason:
          type: string
          example: "Bloqueio solicitado pelo usuário"
        blockedAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        message:
          type: string
          example: "Cartão bloqueado com sucesso"

    CardUnblockResponse:
      type: object
      properties:
        cardId:
          type: string
          example: "card-uuid-123"
        status:
          type: string
          example: "ACTIVE"
        unblockedAt:
          type: string
          format: date-time
          example: "2024-01-15T11:00:00Z"
        message:
          type: string
          example: "Cartão desbloqueado com sucesso"

    BoletoPaymentRequest:
      type: object
      required:
        - digitableLine
        - amount
      properties:
        digitableLine:
          type: string
          description: Linha digitável do boleto
          example: '23793381286007000004123000012305784400000010000'
        amount:
          type: number
          format: float
          minimum: 0.01
          example: 100.00
        dueDate:
          type: string
          format: date
          example: '2025-05-10'
        description:
          type: string
          example: 'Pagamento de boleto de serviço'

    BankTransferRequest:
      type: object
      required:
        - amount
        - destinationAgency
        - destinationAccount
      properties:
        amount:
          type: number
          format: float
          minimum: 0.01
          example: 250.00
        destinationAgency:
          type: string
          example: '0001'
        destinationAccount:
          type: string
          example: '123456-7'
        destinationName:
          type: string
          example: 'Maria Santos'
        description:
          type: string
          example: 'Transferência por agência/conta'

    PixKey:
      type: object
      properties:
        id:
          type: string
          example: 'key-uuid-1'
        type:
          type: string
          enum: [cpf, email, phone, random]
        value:
          type: string
          example: '12345678901'
        createdAt:
          type: string
          format: date-time

    PixKeyCreateRequest:
      type: object
      required: [type, value]
      properties:
        type:
          type: string
          enum: [cpf, email, phone, random]
          example: 'cpf'
        value:
          type: string
          example: '12345678901'

    PixKeysResponse:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/PixKey'

    PixTransferRequest:
      type: object
      required: [amount, key, keyType]
      properties:
        amount:
          type: number
          format: float
          minimum: 0.01
          example: 120.50
        key:
          type: string
          example: 'joao@example.com'
        keyType:
          type: string
          enum: [cpf, email, phone, random]
          example: 'email'
        description:
          type: string
          example: 'Pagamento via PIX por chave'

    InvestmentsList:
      type: object
      properties:
        investments:
          type: array
          items:
            $ref: '#/components/schemas/Investment'

    DepositRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
          format: float
          minimum: 0.01
          example: 500.00
        description:
          type: string
          example: "Depósito via transferência"

    TransferRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
          format: float
          minimum: 0.01
          example: 200.00
        description:
          type: string
          example: "Transferência entre contas"
        transferType:
          type: string
          enum: [TED, DOC]
          example: "TED"
        destination:
          oneOf:
            - type: object
              required: [destinationAccount, destinationAgency]
              properties:
                destinationAccount:
                  type: string
                  example: "654321"
                destinationAgency:
                  type: string
                  example: "0002"
                destinationName:
                  type: string
                  example: "Maria Santos"
            - type: object
              required: [destinationCpf]
              properties:
                destinationCpf:
                  type: string
                  pattern: '^[0-9]{11}$'
                  example: "12345678901"

    CreditPurchaseRequest:
      type: object
      required:
        - amount
        - establishment
      properties:
        amount:
          type: number
          format: float
          minimum: 0.01
          example: 150.00
        establishment:
          type: string
          example: "Supermercado ABC"
        description:
          type: string
          example: "Compra de produtos"

    BillPaymentRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
          format: float
          minimum: 0.01
          example: 300.00
        description:
          type: string
          example: "Pagamento de fatura do cartão de crédito"

    TransactionResponse:
      type: object
      properties:
        transactionId:
          type: string
          description: Identificador da transação, equivalente ao movimentacaoId persistido no sistema
          example: "txn-uuid-123"
        type:
          type: string
          enum: [DEPOSIT, WITHDRAW, TRANSFER, PIX, CREDIT_PURCHASE, BILL_PAYMENT]
        amount:
          type: number
          format: float
        status:
          type: string
          enum: [PENDING, COMPLETED, FAILED]
        date:
          type: string
          format: date-time
        description:
          type: string
        newBalance:
          type: number
          format: float
          description: Saldo resultante após a transação (quando aplicável)
        fee:
          type: number
          format: float
          description: Taxa cobrada na transação (quando aplicável)
        destination:
          type: object
          description: Informações do destinatário (apenas em transferências)
          properties:
            account:
              type: string
            agency:
              type: string
            name:
              type: string
            cpf:
              type: string
        pixKey:
          type: string
          description: Chave PIX utilizada (quando aplicável)
        pixKeyType:
          type: string
          enum: [cpf, email]
          description: Tipo da chave PIX (quando aplicável)
        transactionCode:
          type: string
          description: Código de referência da transação (quando aplicável)
        cardId:
          type: string
          description: Identificador do cartão relacionado (quando aplicável)

    CreditBillPreviewResponse:
      type: object
      properties:
        cardId:
          type: string
        cardNumber:
          type: string
        totalAmount:
          type: number
          format: float
        minimumAmount:
          type: number
          format: float
        limit:
          type: number
          format: float
        availableLimit:
          type: number
          format: float
        dueDate:
          type: string
          format: date
        closingDate:
          type: string
          format: date
        revolvingInterest:
          type: number
          format: float
        hasOpenBill:
          type: boolean

    InvestmentSummary:
      type: object
      properties:
        totalInvestido:
          type: number
          format: float
          example: 10000.00
        totalAtual:
          type: number
          format: float
          example: 10500.00
        rentabilidadeTotal:
          type: number
          format: float
          example: 5.0
        investments:
          type: array
          items:
            $ref: '#/components/schemas/Investment'

    Investment:
      type: object
      properties:
        id:
          type: string
        tipoInvestimento:
          type: string
          enum: [CDB, POUPANCA, TESOURO_DIRETO, FUNDOS]
        valorInvestido:
          type: number
          format: float
        valorAtual:
          type: number
          format: float
        rentabilidade:
          type: number
          format: float
        dataCriacao:
          type: string
          format: date-time

    InvestmentApplicationsResponse:
      type: object
      properties:
        investments:
          type: array
          items:
            $ref: '#/components/schemas/Investment'
        pagination:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer

    InvestmentSimulationRequest:
      type: object
      required:
        - amount
        - type
        - period
      properties:
        amount:
          type: number
          format: float
          minimum: 100
          example: 1000.00
        type:
          type: string
          enum: [CDB, POUPANCA, TESOURO_DIRETO, FUNDOS]
          example: "CDB"
        period:
          type: integer
          minimum: 1
          example: 12

    InvestmentSimulationResponse:
      type: object
      properties:
        simulation:
          type: object
          properties:
            initialAmount:
              type: number
              format: float
            finalAmount:
              type: number
              format: float
            totalReturn:
              type: number
              format: float
            returnPercentage:
              type: number
              format: float
            monthlyReturn:
              type: number
              format: float
            investmentType:
              type: string
            period:
              type: integer
            riskLevel:
              type: string
              enum: [BAIXO, MEDIO, ALTO]

    InvestmentApplicationRequest:
      type: object
      required:
        - amount
        - type
      properties:
        amount:
          type: number
          format: float
          minimum: 100
          example: 1000.00
        type:
          type: string
          enum: [CDB, POUPANCA, TESOURO_DIRETO, FUNDOS]
          example: "CDB"
        name:
          type: string
          example: "CDB Banco Principal"
        description:
          type: string
          example: "Investimento em CDB com rentabilidade de 110% do CDI"

    InvestmentApplicationResponse:
      type: object
      properties:
        message:
          type: string
          example: "Investimento aplicado com sucesso"
        investment:
          type: object
          properties:
            investmentId:
              type: string
            type:
              type: string
            amount:
              type: number
              format: float
            status:
              type: string
            applicationDate:
              type: string
              format: date-time

    SavingsProgramRequest:
      type: object
      required:
        - monthlyAmount
        - dayOfMonth
      properties:
        monthlyAmount:
          type: number
          format: float
          minimum: 50
          example: 200.00
        dayOfMonth:
          type: integer
          minimum: 1
          maximum: 28
          example: 15
        autoIncrease:
          type: boolean
          example: true
        increasePercentage:
          type: number
          format: float
          example: 5.0

    SavingsProgramResponse:
      type: object
      properties:
        message:
          type: string
          example: "Programa de poupança configurado com sucesso"
        program:
          type: object
          properties:
            monthlyAmount:
              type: number
              format: float
            dayOfMonth:
              type: integer
            nextInvestment:
              type: string
              format: date-time
            status:
              type: string

    SavingsResponse:
      type: object
      properties:
        totalSavings:
          type: number
          format: float
        monthlyYield:
          type: number
          format: float
        totalYield:
          type: number
          format: float
        savingsAccounts:
          type: array
          items:
            $ref: '#/components/schemas/Investment'

    InvestmentYieldResponse:
      type: object
      properties:
        investment:
          type: object
          properties:
            investmentId:
              type: string
            name:
              type: string
            type:
              type: string
            status:
              type: string
            performance:
              type: object
              properties:
                initialAmount:
                  type: number
                  format: float
                currentValue:
                  type: number
                  format: float
                totalReturn:
                  type: number
                  format: float
                returnPercentage:
                  type: number
                  format: float
                investmentDate:
                  type: string
                  format: date-time
                daysInvested:
                  type: integer
                maturityDate:
                  type: string
                  format: date-time
            details:
              type: object
              properties:
                returnRate:
                  type: number
                  format: float
                currentYield:
                  type: number
                  format: float
                canRedeem:
                  type: boolean
                description:
                  type: string

    InvestmentRedeemRequest:
      type: object
      properties:
        amount:
          type: number
          format: float
          description: "Valor a ser resgatado. Se não informado, resgata o valor total"
          example: 500.00

    InvestmentRedeemResponse:
      type: object
      properties:
        message:
          type: string
          example: "Resgate realizado com sucesso"
        redemption:
          type: object
          properties:
            investmentId:
              type: string
            redeemedAmount:
              type: number
              format: float
            remainingAmount:
              type: number
              format: float
            newAccountBalance:
              type: number
              format: float
            redemptionDate:
              type: string
              format: date-time
        account:
          type: object
          properties:
            agencia:
              type: string
            conta:
              type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Mensagem de erro"
        message:
          type: string
          example: "Descrição detalhada do erro"
        statusCode:
          type: integer
          example: 400
        timestamp:
          type: string
          format: date-time

tags:
  - name: Sistema
    description: Endpoints de sistema e monitoramento
  - name: Autenticação
    description: Endpoints de autenticação e autorização
  - name: Clientes
    description: Gestão de clientes (criação, consulta e listagem)
  - name: Conta
    description: Gerenciamento de conta do usuário
  - name: Cartões
    description: Gerenciamento de cartões de crédito e débito
  - name: Transações
    description: Operações financeiras (depósitos, transferências, compras)
  - name: Investimentos
    description: Consulta e gerenciamento de investimentos
