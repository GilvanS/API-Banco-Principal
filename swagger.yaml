                $ref: '#/components/schemas/ApiError'

  /investments/summary:
    get:
      tags: ["Investimentos"]
      summary: "Resumo de investimentos do usuário logado."
      description: |
        Retorna um resumo completo dos investimentos do usuário, incluindo:
        - Total investido e valor atual
        - Rentabilidade total e percentual
        - Quantidade de investimentos ativos
        - Agrupamento por tipo de investimento
        - Lista dos investimentos mais recentes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Resumo obtido com sucesso."
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalInvested:
                    type: number
                    format: float
                    example: 5000.00
                    description: "Valor total investido"
                  currentValue:
                    type: number
                    format: float
                    example: 5250.75
                    description: "Valor atual de todos os investimentos"
                  totalReturn:
                    type: number
                    format: float
                    example: 250.75
                    description: "Rendimento total absoluto"
                  returnPercentage:
                    type: number
                    format: float
                    example: 5.02
                    description: "Percentual de rentabilidade total"
                  activeInvestments:
                    type: integer
                    example: 3
                    description: "Quantidade de investimentos ativos"
                  byType:
                    type: array
                    description: "Investimentos agrupados por tipo"
                    items:
                      type: object
                      properties:
                        tipo:
                          type: string
                          example: "POUPANCA"
                        quantidade:
                          type: integer
                          example: 1
                        valorInvestido:
                          type: number
                          format: float
                          example: 1000.00
                        valorAtual:
                          type: number
                          format: float
                          example: 1050.25
                        rentabilidade:
                          type: number
                          format: float
                          example: 5.03
                  recentInvestments:
                    type: array
                    description: "Investimentos mais recentes"
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          example: "267c29c5-a10c-48c4-9035-0c2fdf80dab6"
                        name:
                          type: string
                          example: "Poupança Teste"
                        type:
                          type: string
                          example: "POUPANCA"
                        investedAmount:
                          type: number
                          format: float
                          example: 500.00
                        currentValue:
                          type: number
                          format: float
                          example: 525.13
                        returnPercentage:
                          type: number
                          format: float
                          example: 5.03
                        status:
                          type: string
                          example: "ATIVO"
                        createdAt:
                          type: string
                          format: date-time
                          example: "2025-09-11T01:43:53.000Z"
        '401':
          description: "Token de autenticação inválido ou expirado."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /investments/apply:
    post:
      tags: ["Investimentos"]
      summary: "Aplicar em um novo investimento."
      description: |
        Cria uma nova aplicação de investimento para o usuário logado.
        O valor é debitado automaticamente da conta corrente.
        
        **Tipos de investimento disponíveis:**
        - POUPANCA: Poupança tradicional
        - CDB: Certificado de Depósito Bancário
        - LCI: Letra de Crédito Imobiliário
        - LCA: Letra de Crédito do Agronegócio
        - TESOURO_DIRETO: Títulos do Tesouro Nacional
        - FUNDOS: Fundos de investimento
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo, valor, nome]
              properties:
                tipo:
                  type: string
                  enum: [POUPANCA, CDB, LCI, LCA, TESOURO_DIRETO, FUNDOS]
                  example: "POUPANCA"
                  description: "Tipo do investimento"
                valor:
                  type: number
                  format: float
                  minimum: 1
                  example: 500.00
                  description: "Valor a ser investido (mínimo R$ 1,00)"
                nome:
                  type: string
                  example: "Poupança Teste"
                  description: "Nome personalizado para o investimento"
                descricao:
                  type: string
                  example: "Investimento de teste"
                  description: "Descrição opcional do investimento"
      responses:
        '201':
          description: "Investimento aplicado com sucesso."
          content:
            application/json:
              schema:
                type: object
                properties:
                  investmentId:
                    type: string
                    format: uuid
                    example: "267c29c5-a10c-48c4-9035-0c2fdf80dab6"
                  type:
                    type: string
                    example: "POUPANCA"
                  investedAmount:
                    type: number
                    format: float
                    example: 500.00
                  returnRate:
                    type: number
                    format: float
                    example: 0.5
                    description: "Taxa de retorno anual (%)"
                  maturityDate:
                    type: string
                    format: date
                    example: "2026-09-10"
                    description: "Data de vencimento"
                  status:
                    type: string
                    example: "ATIVO"
                  canRedeem:
                    type: boolean
                    example: true
                    description: "Indica se permite resgate antecipado"
                  newAccountBalance:
                    type: number
                    format: float
                    example: 1500.00
                    description: "Novo saldo da conta após o investimento"
                  message:
                    type: string
                    example: "Investimento realizado com sucesso"
        '400':
          description: "Erro na aplicação (saldo insuficiente, valor inválido, etc.)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: "Token de autenticação inválido ou expirado."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /investments/applications:
    get:
      tags: ["Investimentos"]
      summary: "Listar todas as aplicações do usuário."
      description: |
        Retorna uma lista completa de todos os investimentos do usuário logado,
        incluindo investimentos ativos, vencidos e resgatados.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: "Filtrar por status do investimento"
          schema:
            type: string
            enum: [ATIVO, VENCIDO, RESGATADO]
        - name: tipo
          in: query
          description: "Filtrar por tipo de investimento"
          schema:
            type: string
            enum: [POUPANCA, CDB, LCI, LCA, TESOURO_DIRETO, FUNDOS]
      responses:
        '200':
          description: "Lista de investimentos retornada com sucesso."
          content:
            application/json:
              schema:
                type: object
                properties:
                  investments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Investment'
        '401':
          description: "Token de autenticação inválido ou expirado."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /investments/{investmentId}/yield:
    get:
      tags: ["Investimentos"]
      summary: "Consultar rendimento de um investimento específico."
      description: |
        Retorna informações detalhadas sobre o rendimento de um investimento específico,
        incluindo cálculos de rendimento absoluto, percentual, projeções e período de investimento.
      security:
        - bearerAuth: []
      parameters:
        - name: investmentId
          in: path
          required: true
          description: "ID único do investimento"
          schema:
            type: string
            format: uuid
            example: "267c29c5-a10c-48c4-9035-0c2fdf80dab6"
      responses:
        '200':
          description: "Rendimento consultado com sucesso."
          content:
            application/json:
              schema:
                type: object
                properties:
                  investmentId:
                    type: string
                    format: uuid
                    example: "267c29c5-a10c-48c4-9035-0c2fdf80dab6"
                  name:
                    type: string
                    example: "Poupança Teste"
                  type:
                    type: string
                    example: "POUPANCA"
                  status:
                    type: string
                    example: "ATIVO"
                  investedAmount:
                    type: number
                    format: float
                    example: 500.00
                    description: "Valor investido inicialmente"
                  currentValue:
                    type: number
                    format: float
                    example: 525.13
                    description: "Valor atual do investimento"
                  yield:
                    type: object
                    description: "Informações de rendimento"
                    properties:
                      absolute:
                        type: number
                        format: float
                        example: 25.13
                        description: "Rendimento absoluto (R$)"
                      percentage:
                        type: number
                        format: float
                        example: 5.03
                        description: "Rendimento percentual (%)"
                      dailyAverage:
                        type: number
                        format: float
                        example: 0.84
                        description: "Rendimento diário médio (R$)"
                      monthlyProjected:
                        type: number
                        format: float
                        example: 25.20
                        description: "Rendimento mensal projetado (R$)"
                      annualProjected:
                        type: number
                        format: float
                        example: 306.60
                        description: "Rendimento anual projetado (R$)"
                  period:
                    type: object
                    description: "Informações de período"
                    properties:
                      investmentDate:
                        type: string
                        format: date-time
                        example: "2025-09-11T01:43:53.000Z"
                        description: "Data da aplicação"
                      daysInvested:
                        type: integer
                        example: 30
                        description: "Dias desde a aplicação"
                      maturityDate:
                        type: string
                        format: date
                        example: "2026-09-10"
                        description: "Data de vencimento"
                  rates:
                    type: object
                    description: "Taxas e rendimentos"
                    properties:
                      returnRate:
                        type: number
                        format: float
                        example: 0.5
                        description: "Taxa de retorno anual (%)"
                      currentYield:
                        type: number
                        format: float
                        example: 5.03
                        description: "Rendimento atual (%)"
                  canRedeem:
                    type: boolean
                    example: true
                    description: "Indica se permite resgate"
                  description:
                    type: string
                    example: "Investimento de teste"
        '404':
          description: "Investimento não encontrado."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: "Token de autenticação inválido ou expirado."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /investments/{investmentId}/redeem:
    post:
      tags: ["Investimentos"]
      summary: "Resgatar investimento (parcial ou total)."
      description: |
        Realiza o resgate de um investimento, podendo ser parcial ou total.
        O valor resgatado é creditado automaticamente na conta corrente.
        
        **Tipos de resgate:**
        - **Parcial**: Resgata apenas parte do valor investido
        - **Total**: Resgata todo o valor do investimento (encerra o investimento)
      security:
        - bearerAuth: []
      parameters:
        - name: investmentId
          in: path
          required: true
          description: "ID único do investimento"
          schema:
            type: string
            format: uuid
            example: "267c29c5-a10c-48c4-9035-0c2fdf80dab6"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: number
                  format: float
                  minimum: 0.01
                  example: 200.00
                  description: "Valor a ser resgatado (deve ser maior que zero)"
      responses:
        '200':
          description: "Resgate realizado com sucesso."
          content:
            application/json:
              schema:
                type: object
                properties:
                  investmentId:
                    type: string
                    format: uuid
                    example: "267c29c5-a10c-48c4-9035-0c2fdf80dab6"
                  redeemedAmount:
                    type: number
                    format: float
                    example: 200.00
                    description: "Valor resgatado"
                  remainingAmount:
                    type: number
                    format: float
                    example: 300.00
                    description: "Valor restante no investimento (0 se resgate total)"
                  newAccountBalance:
                    type: number
                    format: float
                    example: 1700.00
                    description: "Novo saldo da conta após o resgate"
                  redeemType:
                    type: string
                    enum: [PARTIAL, TOTAL]
                    example: "PARTIAL"
                    description: "Tipo do resgate realizado"
                  redeemedAt:
                    type: string
                    format: date-time
                    example: "2025-09-11T01:44:15.000Z"
                    description: "Data e hora do resgate"
                  message:
                    type: string
                    example: "Resgate realizado com sucesso"
        '400':
          description: "Erro no resgate (valor inválido, investimento não permite resgate, etc.)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: "Investimento não encontrado."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: "Token de autenticação inválido ou expirado."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
