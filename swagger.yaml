                $ref: '#/components/schemas/TransferenciaResponse'
        '400':
          description: "Erro na transferência."
        '401':
          description: "Token de autenticação inválido ou expirado."

  /transactions/deposit:
    post:
      tags: ["Transações"]
      summary: "Realiza depósito na conta do usuário logado."
      description: "Efetua um depósito na conta bancária do usuário autenticado. O valor é creditado automaticamente no saldo da conta."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [valor]
              properties:
                valor:
                  type: number
                  format: float
                  example: 500.00
                  description: "Valor a ser depositado (deve ser maior que zero)"
      responses:
        '200':
          description: "Depósito realizado com sucesso."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositoResponse'
