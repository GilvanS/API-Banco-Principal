        '404':
          description: "Cartão de crédito ativo não encontrado para o usuário."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /transactions/pay-bill:
    post:
      tags: ["Transações"]
      summary: "Paga fatura do cartão de crédito do usuário logado."
      description: "Efetua o pagamento da fatura do cartão de crédito ativo do usuário autenticado. O valor é debitado da conta corrente do usuário. Agora inclui validação de fatura pendente antes do pagamento."
